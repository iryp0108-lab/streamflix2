name: inspect-updater
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar y mostrar cliente GitGay
        run: |
          git clone --depth 1 https://git.gay/streamflix-reborn2/streamflix.git u
          F=$(find u/app/src/main/java -iname "GitGay*.kt" | head -1)
          echo "=====FILE $F====="
          echo "=====BEGIN GitGay====="
          cat "$F" || echo "NO EXISTE"
          echo "=====END GitGay====="
          echo "=====GREP base url / interceptors en utils====="
          grep -rniE "git\.gay|api/v1|baseUrl|\.baseUrl|addHeader|addInterceptor|Retrofit|OkHttpClient" u/app/src/main/java/com/streamflixreborn/streamflix/utils/ | head -50
