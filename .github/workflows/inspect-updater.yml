name: inspect-updater
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar y mostrar updater
        run: |
          git clone --depth 1 https://git.gay/streamflix-reborn2/streamflix.git u
          echo "=====BEGIN InAppUpdater.kt====="
          cat u/app/src/main/java/com/streamflixreborn/streamflix/utils/InAppUpdater.kt || echo "NO EXISTE"
          echo "=====END InAppUpdater.kt====="
          echo "=====GREP fuente de updates====="
          grep -rniE "git\.gay|/releases|api\.github|api/v1|baseUrl|RELEASES_URL|UPDATE_URL|owner|repo|tagName|browser_download" u/app/src/main/java/com/streamflixreborn/streamflix/ | head -50
