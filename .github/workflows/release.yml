name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Secrets -> local.properties
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RABBITSTREAM_SOURCE_API: ${{ secrets.RABBITSTREAM_SOURCE_API }}
        run: |
          echo "TMDB_API_KEY=$TMDB_API_KEY" >> local.properties
          echo "RABBITSTREAM_SOURCE_API=$RABBITSTREAM_SOURCE_API" >> local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # ---------- Universal ----------
      - name: Build APK (universal)
        run: ./gradlew assembleRelease --stacktrace
      - name: Sign APK (universal)
        id: sign_universal
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      - name: Stage universal APK
        run: cp "${{ steps.sign_universal.outputs.signedReleaseFile }}" "PablitosTV-${{ github.ref_name }}.apk"

      # ---------- Solo móvil ----------
      - name: Set mobile layout
        run: echo "APP_LAYOUT=mobile" >> local.properties
      - name: Build APK (mobile)
        run: ./gradlew assembleRelease --stacktrace
      - name: Sign APK (mobile)
        id: sign_mobile
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      - name: Stage mobile APK
        run: cp "${{ steps.sign_mobile.outputs.signedReleaseFile }}" "PablitosTV-${{ github.ref_name }}-mobile.apk"

      # ---------- Solo TV ----------
      - name: Set tv layout
        run: echo "APP_LAYOUT=tv" >> local.properties
      - name: Build APK (tv)
        run: ./gradlew assembleRelease --stacktrace
      - name: Sign APK (tv)
        id: sign_tv
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
      - name: Stage tv APK
        run: cp "${{ steps.sign_tv.outputs.signedReleaseFile }}" "PablitosTV-${{ github.ref_name }}-tv.apk"

      # ---------- Publicar release (idempotente) ----------
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Pablito's TV ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            PablitosTV-${{ github.ref_name }}.apk
            PablitosTV-${{ github.ref_name }}-mobile.apk
            PablitosTV-${{ github.ref_name }}-tv.apk
