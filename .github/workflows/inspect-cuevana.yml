name: inspect-cuevana
on:
  workflow_dispatch:
jobs:
  i:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone --depth 1 https://git.gay/streamflix-reborn2/streamflix.git u
          F=$(find u/app/src/main/java -iname "*Cuevana*.kt" | head -1)
          echo "=====FILE $F====="
          echo "=====BEGIN====="
          sed -n '1,80p' "$F"
          echo "=====END====="
          echo "=====URLS en el provider====="
          grep -oniE "https?://[a-z0-9._/-]+" "$F" | head -20
